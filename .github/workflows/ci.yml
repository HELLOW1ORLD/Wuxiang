name: Source and scoring checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Audit publishable source
        run: python tools/audit_source.py
      - name: Config regression tests
        run: python -m unittest discover -s tests -p test_config.py -v
      - name: Pack and executable scorer tests
        run: python -m unittest discover -s tests -p test_bench.py -v
